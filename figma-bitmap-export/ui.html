<!doctype html>
<html>
<head>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; font: 12px Inter, sans-serif; color: #222; }
    h2 { margin: 0 0 8px; font-size: 16px; }
    p { margin: 0 0 16px; color: #666; line-height: 1.4; }
    button { width: 100%; border: 0; border-radius: 6px; padding: 10px; cursor: pointer; font-weight: 600; }
    #export { background: #18a566; color: white; }
    #close { margin-top: 8px; background: #eee; color: #333; }
    #status { min-height: 18px; margin-top: 14px; color: #555; }
    #groups { max-height: 120px; overflow: auto; margin-bottom: 12px; }
    .row { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
    .row span { width: 42px; color: #777; }
    input { flex: 1; min-width: 0; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>Export C++ bitmaps</h2>
  <p>Name each selected group, then export 1-bit bitmap variables in one C++ header.</p>
  <div id="groups">Select groups in Figma, then click Refresh.</div>
  <button id="refresh">Refresh selection</button>
  <label for="header-name">Header filename</label>
  <input id="header-name" value="t12_bitmaps.h" />
  <button id="export">Export .h file</button>
  <button id="close">Close</button>
  <div id="status"></div>
  <script>
    const status = document.getElementById("status");
    const files = [];
    const button = document.getElementById("export");
    const groups = document.getElementById("groups");
    const headerName = document.getElementById("header-name");
    let selected = [];
    document.getElementById("refresh").onclick = () => parent.postMessage({pluginMessage: {type: "list"}}, "*");
    button.onclick = () => {
      button.disabled = true;
      status.textContent = "Preparing export…";
      const names = [...groups.querySelectorAll("input")].map((input) => input.value.trim());
      parent.postMessage({ pluginMessage: { type: "export", names } }, "*");
    };
    document.getElementById("close").onclick = () =>
      parent.postMessage({ pluginMessage: { type: "close" } }, "*");
    onmessage = (event) => {
      const m = event.data.pluginMessage;
      if (!m) return;
      if (m.type === "selection") {
        selected = m.nodes.filter((n) => n.exportable);
        groups.innerHTML = selected.length ? "" : "No exportable groups selected.";
        selected.forEach((node, i) => {
          const row = document.createElement("div"); row.className = "row";
          const label = document.createElement("span"); label.textContent = `${i + 1}.`;
          const input = document.createElement("input"); input.value = node.name; input.dataset.id = node.id;
          row.append(label, input); groups.appendChild(row);
        });
        button.disabled = !selected.length;
        status.textContent = selected.length ? `${selected.length} group(s) ready.` : "Select at least one group.";
      }
      if (m.type === "error") { status.textContent = m.text; button.disabled = false; }
      if (m.type === "start") status.textContent = `Exporting ${m.count} group(s)…`;
      if (m.type === "file") {
        files.push(m);
        status.textContent = `Rasterizing ${m.index}/${m.count}: ${m.name}`;
      }
      if (m.type === "done") buildHeader();
    };
    parent.postMessage({pluginMessage: {type: "list"}}, "*");

    function ident(name) {
      let s = name.replace(/[^a-z0-9]+/gi, "_").replace(/^\d+/, "_$&").toLowerCase();
      return s || "bitmap";
    }
    function rasterize(file) {
      return new Promise((resolve, reject) => {
        const blob = new Blob([new Uint8Array(file.bytes)], {type: "image/png"});
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
          const ctx = canvas.getContext("2d"); ctx.drawImage(img, 0, 0);
          const rgba = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
          const bytes = [];
          for (let y = 0; y < canvas.height; y++) {
            for (let x = 0; x < canvas.width; x += 8) {
              let b = 0;
              for (let bit = 0; bit < 8 && x + bit < canvas.width; bit++) {
                const p = ((y * canvas.width) + x + bit) * 4;
                const on = rgba[p + 3] > 16 && (rgba[p] + rgba[p+1] + rgba[p+2]) / 3 < 160;
                if (on) b |= 1 << (7 - bit);
              }
              bytes.push(b);
            }
          }
          resolve({name: ident(file.name), width: canvas.width, height: canvas.height, bytes});
        };
        img.onerror = reject; img.src = URL.createObjectURL(blob);
      });
    }
    async function buildHeader() {
      try {
        const bitmaps = await Promise.all(files.map(rasterize));
        let out = "// Generated by T12 Bitmap Group Exporter\n#pragma once\n#include <cstdint>\n\n";
        out += "struct Bitmap1bpp { uint16_t width, height; const uint8_t *data; };\n\n";
        for (const b of bitmaps) {
          out += `static constexpr uint8_t ${b.name}_data[] = {\n  `;
          out += b.bytes.map((v, i) => `0x${v.toString(16).padStart(2, "0")}${(i + 1) % 12 === 0 ? "\\n  " : ", "}`).join("");
          out += `\n};\nstatic constexpr Bitmap1bpp ${b.name}{${b.width}, ${b.height}, ${b.name}_data};\n\n`;
        }
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([out], {type: "text/plain"}));
        let filename = headerName.value.trim().replace(/[^a-z0-9._-]+/gi, "_");
        if (!filename) filename = "t12_bitmaps.h";
        if (!/\.h$/i.test(filename)) filename += ".h";
        link.download = filename; link.click();
        status.textContent = `Export complete: ${bitmaps.length} bitmap(s) in ${filename}`;
      } catch (e) { status.textContent = "Could not rasterize the selection."; }
      button.disabled = false;
    }
  </script>
</body>
</html>
